<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mensajería Express - Registrarse</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .contenedor-registro {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, .10);
        }

        .encabezado {
            text-align: center;
            margin-bottom: 28px;
        }

        .icono {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #111;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        h1 {
            font-size: 26px;
            color: #111;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #777;
            font-size: 14px;
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .campo {
            margin-bottom: 17px;
        }

        .campo label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 15px;
            outline: none;
            transition: .2s;
        }

        input:focus {
            border-color: #111;
        }

        .boton-registro {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: .2s;
            margin-top: 5px;
        }

        .boton-registro:hover {
            background: #333;
        }

        .boton-registro:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .mensaje {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .mensaje.error {
            display: block;
            background: #ffe5e5;
            color: #b00000;
        }

        .mensaje.exito {
            display: block;
            background: #e5f8e8;
            color: #176b2c;
        }

        .enlaces {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
        }

        .enlaces p {
            margin-bottom: 12px;
            color: #777;
        }

        .enlaces a {
            color: #111;
            font-weight: 600;
            text-decoration: none;
        }

        .enlaces a:hover {
            text-decoration: underline;
        }

        .volver {
            display: block;
            margin-top: 15px;
            color: #777 !important;
            font-weight: normal !important;
        }

        @media (max-width: 600px) {

            .contenedor-registro {
                padding: 25px 20px;
            }

            .fila {
                grid-template-columns: 1fr;
                gap: 0;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>

</head>

<body>

    <div class="contenedor-registro">

        <div class="encabezado">

            <div class="icono">
                <i class="ri-user-add-line"></i>
            </div>

            <h1>Crear cuenta</h1>

            <p class="subtitulo">
                Regístrate en Mensajería Express
            </p>

        </div>


        <form id="formRegistro">

            <div class="fila">

                <div class="campo">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input type="text" id="nombre" placeholder="Tu nombre" required autocomplete="given-name">

                </div>


                <div class="campo">

                    <label for="apellido">
                        Apellido
                    </label>

                    <input type="text" id="apellido" placeholder="Tu apellido" required autocomplete="family-name">

                </div>

            </div>


            <div class="campo">

                <label for="correo">
                    Correo electrónico
                </label>

                <input type="email" id="correo" placeholder="correo@ejemplo.com" required autocomplete="email">

            </div>


            <div class="campo">

                <label for="telefono">
                    Teléfono
                </label>

                <input type="tel" id="telefono" placeholder="Ej. 99999999" required autocomplete="tel">

            </div>


            <div class="campo">

                <label for="password">
                    Contraseña
                </label>

                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6"
                    autocomplete="new-password">

            </div>


            <div class="campo">

                <label for="confirmarPassword">
                    Confirmar contraseña
                </label>

                <input type="password" id="confirmarPassword" placeholder="Repite tu contraseña" required minlength="6"
                    autocomplete="new-password">

            </div>


            <button type="submit" id="botonRegistro" class="boton-registro">

                <i class="ri-user-add-line"></i>

                Crear cuenta

            </button>


            <div id="mensajeRegistro" class="mensaje"></div>

        </form>


        <div class="enlaces">

            <p>

                ¿Ya tienes una cuenta?

                <a href="iniciarsesion.html">
                    Iniciar sesión
                </a>

            </p>


            <a href="index.html" class="volver">

                <i class="ri-arrow-left-line"></i>

                Volver al inicio

            </a>

        </div>

    </div>


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>


    <!-- =====================================================
         COMPROBAR SUPABASE
    ====================================================== -->

    <script>

        console.log(
            "SUPABASE CARGADO:",
            window.supabase
        );

    </script>


    <!-- =====================================================
         REGISTRO
    ====================================================== -->

    <script src="registro.js"></script>

</body>

</html>
