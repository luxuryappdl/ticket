<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mensajería Express - Iniciar sesión</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .contenedor-login {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, .10);
        }

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }

        .icono {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #111;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        h1 {
            font-size: 26px;
            color: #111;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #777;
            font-size: 14px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .input-contenedor {
            position: relative;
        }

        .input-contenedor i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            font-size: 19px;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 0 45px;
            font-size: 15px;
            outline: none;
            transition: .2s;
        }

        input:focus {
            border-color: #111;
        }

        .boton-login {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: .2s;
        }

        .boton-login:hover {
            background: #333;
        }

        .boton-login:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .mensaje {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .mensaje.error {
            display: block;
            background: #ffe5e5;
            color: #b00000;
        }

        .mensaje.exito {
            display: block;
            background: #e5f8e8;
            color: #176b2c;
        }

        .enlaces {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
        }

        .enlaces p {
            margin-bottom: 12px;
            color: #777;
        }

        .enlaces a {
            color: #111;
            font-weight: 600;
            text-decoration: none;
        }

        .enlaces a:hover {
            text-decoration: underline;
        }

        .volver {
            display: block;
            margin-top: 15px;
            color: #777 !important;
            font-weight: normal !important;
        }

        @media (max-width: 480px) {

            .contenedor-login {
                padding: 25px 20px;
            }

            h1 {
                font-size: 23px;
            }

        }
    </style>

</head>

<body>

    <div class="contenedor-login">

        <div class="encabezado">

            <div class="icono">
                <i class="ri-user-line"></i>
            </div>

            <h1>Iniciar sesión</h1>

            <p class="subtitulo">
                Ingresa a tu cuenta de Mensajería Express
            </p>

        </div>


        <form id="formLogin">

            <div class="campo">

                <label for="correo">
                    Correo electrónico
                </label>

                <div class="input-contenedor">

                    <i class="ri-mail-line"></i>

                    <input type="email" id="correo" placeholder="correo@ejemplo.com" required autocomplete="email">

                </div>

            </div>


            <div class="campo">

                <label for="password">
                    Contraseña
                </label>

                <div class="input-contenedor">

                    <i class="ri-lock-line"></i>

                    <input type="password" id="password" placeholder="Tu contraseña" required
                        autocomplete="current-password">

                </div>

            </div>


            <button type="submit" id="botonLogin" class="boton-login">

                <i class="ri-login-box-line"></i>

                Iniciar sesión

            </button>


            <div id="mensajeLogin" class="mensaje"></div>

        </form>


        <div class="enlaces">

            <p>
                ¿No tienes una cuenta?
                <a href="registrarse.html">
                    Registrarse
                </a>
            </p>

            <a href="index.html" class="volver">
                <i class="ri-arrow-left-line"></i>
                Volver a ventas
            </a>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="iniciarsesion.js"></script>

</body>

</html>
